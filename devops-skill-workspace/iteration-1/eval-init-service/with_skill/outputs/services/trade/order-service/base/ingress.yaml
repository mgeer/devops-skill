apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service
  labels:
    app: order-service
    domain: trade
    managed-by: devops-skill
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
