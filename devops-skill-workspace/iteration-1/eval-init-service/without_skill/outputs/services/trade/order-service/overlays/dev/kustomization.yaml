apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trade-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: order-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: order-service
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
  - target:
      kind: Ingress
      name: order-service
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: order-service
      spec:
        rules:
          - host: order-service.dev.example.com
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: order-service
                      port:
                        number: 80
