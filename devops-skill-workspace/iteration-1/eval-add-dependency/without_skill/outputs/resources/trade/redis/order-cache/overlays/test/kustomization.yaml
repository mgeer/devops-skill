apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trade-test

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: order-cache
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-cache
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
