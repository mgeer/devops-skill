apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trade-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: order-cache
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-cache
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: 500m
                    memory: 1Gi
  - target:
      kind: ConfigMap
      name: order-cache-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: order-cache-config
      data:
        redis.conf: |
          bind 0.0.0.0
          port 6379
          protected-mode no
          appendonly yes
          appendfsync everysec
          maxmemory 800mb
          maxmemory-policy allkeys-lru
          loglevel warning
          tcp-keepalive 300
          timeout 0
          # Production hardening
          rename-command FLUSHDB ""
          rename-command FLUSHALL ""
          rename-command DEBUG ""
