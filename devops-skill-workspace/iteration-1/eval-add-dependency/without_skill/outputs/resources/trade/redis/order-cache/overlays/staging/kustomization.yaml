apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trade-staging

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: order-cache
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-cache
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
  - target:
      kind: ConfigMap
      name: order-cache-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: order-cache-config
      data:
        redis.conf: |
          bind 0.0.0.0
          port 6379
          protected-mode no
          appendonly yes
          appendfsync everysec
          maxmemory 200mb
          maxmemory-policy allkeys-lru
          loglevel notice
          tcp-keepalive 300
          timeout 0
