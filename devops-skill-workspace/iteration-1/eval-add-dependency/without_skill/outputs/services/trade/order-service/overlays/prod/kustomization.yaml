apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trade-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: order-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-service
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: order-service
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
                env:
                  - name: REDIS_HOST
                    value: order-cache.trade-prod.svc.cluster.local
                  - name: REDIS_PORT
                    value: "6379"
                  - name: REDIS_DB
                    value: "0"
  - target:
      kind: Ingress
      name: order-service
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: order-service
      spec:
        rules:
          - host: order-service.example.com
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: order-service
                      port:
                        number: 80
