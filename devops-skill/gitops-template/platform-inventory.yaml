clusters:
  - name: int-cluster
    api_server: https://10.66.3.165:6443
    environments: [int, test, staging]
  - name: prod
    api_server: https://k8s-prod.company.com
    environments: [prod]

environments:
  int:     { cluster: int-cluster, auto_deploy: true,  approval: none }
  test:    { cluster: int-cluster, auto_deploy: false, approval: reviewer }
  staging: { cluster: int-cluster, auto_deploy: false, approval: tech-lead }
  prod:    { cluster: prod,        auto_deploy: false, approval: tech-lead+sre }

domains:
  - name: nrtk
    namespaces:
      int: int-nrtk
      test: test-nrtk
      staging: staging-nrtk
      prod: prod-nrtk
  - name: ppp-rtk
    namespaces:
      int: int-ppp-rtk
      test: test-ppp-rtk
      staging: staging-ppp-rtk
      prod: prod-ppp-rtk
  - name: biz-app
    namespaces:
      int: int-biz-app
      test: test-biz-app
      staging: staging-biz-app
      prod: prod-biz-app
  - name: bigdata
    namespaces:
      int: int-bigdata
      test: test-bigdata
      staging: staging-bigdata
      prod: prod-bigdata
  - name: tools
    namespaces:
      int: int-tools
      test: test-tools
      staging: staging-tools
      prod: prod-tools

naming:
  service: "{name}"
  namespace: "{env}-{domain}"
  mysql_instance: "{service}-db"
  redis_instance: "{service}-cache"
  kafka_topic: "{domain}.{service}.{event}"
  docker_image: "{registry}/{domain}/{service}:{git-sha-short}"
  label_app: "{service}"
  label_domain: "{domain}"

middleware:
  kafka:
    available: true
    operator: strimzi
    version: "0.38"
    cluster_name: kafka-cluster
    bootstrap: kafka-cluster-kafka-bootstrap.kafka.svc:9092
  mysql:
    available: true
    operator: oracle-mysql-operator
    version: "8.0"
  redis:
    available: true
    operator: redis-operator
    version: "7.0"

observability:
  metrics: { available: true, stack: prometheus }
  logging: { available: true, stack: loki }
  tracing: { available: true, stack: opentelemetry }
  grafana: { url: "https://grafana.company.com" }

registry:
  url: 10.68.65.39
  project: "{domain}"

gitlab:
  url: https://10.210.73.237
  gitops_repo: devops1/gitops
